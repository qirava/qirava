[package]
name = "qirava-site"
version = "0.1.0"
edition = "2021"
description = "The Qirava website — a Quill app that dogfoods Quill (static SSG)."
license = "Apache-2.0"

# ---------------------------------------------------------------------------
# The Qirava website is itself a Qirava Quill app: a plain Rust binary that
# depends on the DMS engine (`qdms`) plus the Quill UI crates, registers its
# routes, and either SERVES server-rendered HTML over a worker (`cargo run`) or
# EXPORTS a static `dist/` (`cargo run -- build`).
#
# ZERO third-party dependencies — std + first-party Qirava crates only. These
# are RELATIVE path deps into the sibling crates: `qirava/` sits beside `qdms/`,
# `qquill/`, and `qpkgs/` under the Qirava root, so every path is `../`-relative.
# ---------------------------------------------------------------------------
[dependencies]
qdms           = { path = "../qdms" }
qexec          = { path = "../qpkgs/qexec" }
qvalue         = { path = "../qpkgs/qvalue" }
qquill-view    = { path = "../qquill/qquill-view" }
qquill-style   = { path = "../qquill/qquill-style" }
qquill-build   = { path = "../qquill/qquill-build" }
qquill-runtime = { path = "../qquill/qquill-runtime" }
qquill-design  = { path = "../qquill/qquill-design" }
qquill-theme   = { path = "../qquill/qquill-theme" }
qquill-icons   = { path = "../qquill/qquill-icons" }

[[bin]]
name = "qirava-site"
path = "src/main.rs"
